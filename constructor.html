<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Construye el código</title>
    <link rel="stylesheet" href="css/constructor.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <!-- Retomar donde lo dejaste: va en el head para saltar antes de pintar -->
    <script src="js/sesion.js"></script>
  </head>
  <body>
    <div class="wrap">
      <nav class="sitenav" id="sitenav"></nav>

      <header class="topbar">
        <p class="eyebrow">Responde a, b o c y mira cómo se construye</p>
        <h1>Construye el código</h1>
        <p class="subtitle">
          Elige un ejercicio. Cada paso queda bloqueado hasta que aciertas:
          solo entonces se añade la línea al programa que se está formando
          debajo y se desbloquea el siguiente paso.
        </p>
      </header>

      <div class="program-grid" id="programGrid"></div>

      <div class="workspace">
        <section class="quiz-panel" id="quizPanel"></section>
        <section class="code-panel">
          <h2>Código en construcción</h2>
          <pre class="code-output" id="codeOutput"></pre>
        </section>
      </div>
    </div>

    <script src="js/nav.js"></script>

    <script src="js/theme.js"></script>
    <script src="js/constructor-data.js"></script>
    <script src="js/constructor.js"></script>
  </body>
</html>
