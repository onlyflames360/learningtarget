<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Buscador — ¿Qué necesito para...?</title>
    <link rel="stylesheet" href="css/buscar.css" />
    <link rel="stylesheet" href="css/nav.css" />
    <!-- Retomar donde lo dejaste: va en el head para saltar antes de pintar -->
    <script src="js/sesion.js"></script>
  </head>
  <body>
    <div class="wrap">
      <nav class="sitenav" id="sitenav"></nav>

      <header class="topbar">
        <p class="eyebrow">Busca por lo que quieres hacer</p>
        <h1>¿Qué necesito para...?</h1>
        <p class="subtitle">
          No hace falta que sepas cómo se llama. Escríbelo con tus palabras
          —"cambiar número a texto", "contador de letras", "guardar datos"—
          y te digo <strong>cuál es la herramienta que buscas</strong>, qué
          es exactamente y cómo se usa.
        </p>
      </header>

      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input
          id="buscadorInput"
          type="text"
          autocomplete="off"
          placeholder="Ej: cambiar número a texto, contar palabras, al pulsar un botón..."
        />
        <button class="limpiar-btn" id="limpiarBtn" type="button">Limpiar</button>
      </div>

      <div class="chips" id="chips"></div>

      <main id="resultados"></main>
    </div>

    <script src="js/nav.js"></script>

    <script src="js/theme.js"></script>
    <script src="js/metodos-data.js"></script>
    <script src="js/buscar-data.js"></script>
    <script src="js/buscar.js"></script>
  </body>
</html>
